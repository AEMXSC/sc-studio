<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SC Studio</title>
  <link rel="stylesheet" href="/studio.css">
  <script src="/studio.js" type="module"></script>
</head>
<body class="loading">
  <main class="studio">
    <section class="pane form-pane" aria-label="Content form">
      <iframe id="form-frame" title="Structured content form" hidden></iframe>
      <div class="live" id="live" hidden>
        <div class="rail-empty">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M33 19 9 31l12 4 4 12z"/><path d="M41 9v12M35 15h12"/></svg>
          <p class="rail-empty-title">Nothing selected</p>
          <p>Select content in the app to edit it in this panel.</p>
        </div>
        <div class="live-head">
          <span id="live-status" class="status" role="status">Loading…</span>
          <a class="ghost" id="edit-schema" target="_blank" rel="noopener" title="Edit this record's schema in a new tab" hidden>Edit schema</a>
          <button type="button" class="ghost" id="live-preview" disabled>Preview</button>
          <button type="button" class="primary" id="live-publish" disabled>Publish</button>
        </div>
        <p class="record-label" id="record-label" hidden></p>
        <div class="record-field" id="record-field" hidden>
          <span class="field-icon" id="field-icon" aria-hidden="true"></span><span id="field-name"></span>
          <button type="button" class="icon" popovertarget="record-menu" title="More" aria-label="More for this record">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fill" cx="5" cy="12" r="1.8"/><circle class="fill" cx="12" cy="12" r="1.8"/><circle class="fill" cx="19" cy="12" r="1.8"/></svg>
          </button>
          <div class="menu" id="record-menu" popover></div>
        </div>
        <form class="live-form" id="live-form" novalidate></form>
      </div>
    </section>
    <section class="pane preview-pane" aria-label="Channel preview">
      <div class="preview-head">
        <!-- page mode only (.pm): laid out like Universal Editor's header -->
        <!-- no Home button: DA's own shell has one -->
        <button type="button" class="icon pm" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button type="button" class="icon pm" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
        <form class="address" id="address" hidden>
          <span class="scheme" id="app-scheme" aria-hidden="true">https</span>
          <input id="app-url" type="text" inputmode="url" autocomplete="url" spellcheck="false" aria-label="App address" placeholder="Paste your app's address, e.g. my-app.vercel.app" required>
        </form>
        <div class="modes pm" id="mode" role="group" aria-label="Edit content or preview the app">
          <button type="button" class="icon on" data-mode="edit" title="Edit: click content to select it" aria-label="Edit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4.5L19.5 9 15 4.5 4 15.5zM13 6.5l4.5 4.5"/></svg>
          </button>
          <button type="button" class="icon" data-mode="browse" title="Preview: use the app, links and buttons work" aria-label="Preview the app">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5v14l11-7z"/></svg>
          </button>
        </div>
        <button type="button" class="icon pm" id="device-btn" popovertarget="device-menu" title="Device" aria-label="Device size">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M9 20.5h6M12 16.5v4"/></svg>
        </button>
        <div class="menu" id="device-menu" popover>
          <button type="button" data-size="desktop" class="on">Desktop</button>
          <button type="button" data-size="tablet">Tablet</button>
          <button type="button" data-size="phone">Phone</button>
        </div>
        <a class="icon pm" id="open-app" target="_blank" rel="noopener" title="Open the app in a new tab" aria-label="Open the app in a new tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 4.5h6v6M19.5 4.5 11 13M10 6H4.5v13.5H18V14"/></svg>
        </a>
        <button type="button" class="publish pm" id="publish-btn" popovertarget="publish-panel">Publish</button>
        <div class="panel" id="publish-panel" popover>
          <div id="publish-main">
            <h2>Publish</h2>
            <h3>Destination</h3>
            <div class="dest" role="radiogroup" aria-label="Destination">
              <label class="dest-card"><input type="radio" name="publish-dest" value="preview"> Preview</label>
              <label class="dest-card"><input type="radio" name="publish-dest" value="live" checked> Live</label>
            </div>
            <h3>Items</h3>
            <div class="items-row">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="13" height="11" rx="1.5"/><path d="M7.5 19.5h11a2 2 0 0 0 2-2v-9"/></svg>
              <span id="publish-count">…</span>
              <button type="button" class="pill" id="publish-view">View</button>
            </div>
            <div class="panel-foot"><button type="button" class="publish" id="publish-go" disabled>Publish</button></div>
          </div>
          <div id="publish-items" hidden>
            <div class="items-head">
              <button type="button" class="icon" id="publish-back" aria-label="Back">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
              </button>
              <h2>Items</h2>
              <button type="button" class="chip" data-publish-filter="modified" id="publish-filter-modified">Modified</button>
              <button type="button" class="chip" data-publish-filter="all" id="publish-filter-all">All</button>
              <input type="checkbox" id="publish-all" aria-label="Select all">
            </div>
            <ul class="publish-list" id="publish-list"></ul>
          </div>
        </div>
        <button type="button" class="icon pm" id="more-btn" popovertarget="more-menu" title="More" aria-label="More">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fill" cx="5" cy="12" r="1.8"/><circle class="fill" cx="12" cy="12" r="1.8"/><circle class="fill" cx="19" cy="12" r="1.8"/></svg>
        </button>
        <div class="menu" id="more-menu" popover>
          <button type="button" id="reload-app">Reload the app</button>
          <button type="button" id="change-app">Open another app</button>
        </div>
        <select id="channel" aria-label="Channel"></select>
        <div class="tier" id="tier" role="group" aria-label="Show the draft or the live version">
          <button type="button" data-tier="preview" class="on" title="Show previewed content (and live drafts)">Draft</button>
          <button type="button" data-tier="live" title="Show published content">Live</button>
        </div>
        <span id="status" class="status" role="status"></span>
        <a class="ghost" id="open" target="_blank" rel="noopener" title="Open this channel in a new tab">Open channel ↗</a>
        <button type="button" class="ghost" id="reload" title="Reload preview" aria-label="Reload preview">↻</button>
      </div>
      <div class="device-wrap" id="device-wrap">
        <div class="device" id="device">
          <iframe id="preview-frame" title="Channel preview"></iframe>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
    <span id="toast-text"></span>
    <button type="button" id="toast-close" aria-label="Dismiss">✕</button>
  </div>
</body>
</html>
